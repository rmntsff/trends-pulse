<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Trends Pulse</title>
  <link rel="preload" href="/fonts/inter-cyrillic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/inter-cyrillic-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">
      <h1 id="screen-title">Trends Pulse</h1>
      <p class="topbar-sub"><span id="status-dot" class="live-dot"></span><span id="screen-sub"></span></p>
    </div>
    <button id="sync" class="sync-pill" type="button" aria-label="Оновити тренди" hidden><span></span></button>
  </header>

  <main id="content" aria-live="polite"></main>

  <nav id="nav" class="bottom-nav" aria-label="Розділи"></nav>

  <dialog id="sheet-region" class="sheet" aria-labelledby="region-title">
    <h2 id="region-title">Країна для третьої вкладки</h2>
    <div id="region-options" class="chips" role="radiogroup" aria-labelledby="region-title"></div>
  </dialog>

  <dialog id="sheet-ai-log" class="sheet" aria-labelledby="ai-log-title">
    <h2 id="ai-log-title">Остання відповідь Gemini</h2>
    <pre id="ai-log"></pre>
    <button class="cta" type="button" data-close>Зрозуміло</button>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
